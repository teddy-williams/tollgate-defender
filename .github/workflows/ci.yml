name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}   # Windows/macOS are best-effort for now
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[all,dev]"
      - run: ruff check .
      - run: python -m pytest -q

  docker:
    name: docker build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t tollgate:ci .
      - name: Offline CLI smoke test (no network, read-only filesystem)
        run: |
          echo "hello" > sample.txt
          docker run --rm --network none --read-only --tmpfs /data:uid=10001 \
            -v "$PWD/sample.txt:/samples/invoice.pdf.exe:ro" tollgate:ci scan /samples/invoice.pdf.exe --no-record || [ $? -eq 1 ]
          docker run --rm --network none tollgate:ci defang http://example.com/a
