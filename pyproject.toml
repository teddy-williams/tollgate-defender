[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tollgate-defender"
dynamic = ["version"]
description = "Defender-focused file and URL triage: static analysis, YARA, threat intel, scan history, safe redirect tracing."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ghost" }]
keywords = ["malware-analysis", "yara", "dfir", "blue-team", "threat-intelligence", "pe", "lnk", "pdf", "phishing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Information Technology",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["pefile>=2023.2.7"]

[project.optional-dependencies]
yara = ["yara-python>=4.5.0"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
all = ["tollgate-defender[yara,web]"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
tollgate = "tollgate.cli:main"

[project.urls]
Homepage = "https://github.com/teddy-williams/tollgate-defender"
Issues = "https://github.com/teddy-williams/tollgate-defender/issues"
Changelog = "https://github.com/teddy-williams/tollgate-defender/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["tollgate*"]

[tool.setuptools.package-data]
tollgate = ["static/*", "rules/*.yar"]

[tool.setuptools.dynamic]
version = { attr = "tollgate.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E9", "F"]
